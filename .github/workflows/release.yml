name: Release

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Get Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Get Npcap Sdk
        run: |
          curl https://npcap.com/dist/npcap-sdk-1.15.zip -o sdk.zip
          unzip sdk.zip

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release
        env:
          LIB: ${{ github.workspace }}/Lib/x64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/stardb-exporter.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Get Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release

      - name: Cap Net Raw
        run: sudo setcap CAP_NET_RAW=+ep target/release/stardb-exporter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/stardb-exporter

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev patchelf libfuse2 jq

      - name: Get Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./scripts/build_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/*.AppImage

  build-macos:
    name: Build Macos
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install libpcap
        run: brew update && brew install libpcap

      - name: Get Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/stardb-exporter

  release:
    name: Release
    needs: [build-windows, build-linux, build-macos, build-appimage]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Get package version
        id: cargo-get
        uses: nicolaiunrein/cargo-get@master
        with:
          subcommand: package.version

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Rename
        run: |
          set -euo pipefail
          VERSION="${{ steps.cargo-get.outputs.metadata }}"

          WIN_EXE="$(find windows -name 'stardb-exporter.exe' -type f | head -n1)"
          LINUX_BIN="$(find linux -name 'stardb-exporter' -type f | head -n1)"
          MAC_BIN="$(find macos -name 'stardb-exporter' -type f | head -n1)"
          APPIMAGE_FILE="$(find appimage -name '*.AppImage' -type f | head -n1)"

          cp "$WIN_EXE" stardb-exporter.exe
          zip "stardb-exporter-v${VERSION}-x86_64-pc-windows-msvc.zip" stardb-exporter.exe

          cp "$LINUX_BIN" stardb-exporter
          cp stardb-exporter stardb-exporter-linux
          zip "stardb-exporter-v${VERSION}-x86_64-unknown-linux-gnu.zip" stardb-exporter

          cp "$MAC_BIN" stardb-exporter
          cp stardb-exporter stardb-exporter-macos
          zip "stardb-exporter-v${VERSION}-x86_64-apple-darwin.zip" stardb-exporter

          cp "$APPIMAGE_FILE" "stardb-exporter-v${VERSION}-x86_64.AppImage"

      - name: Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: v${{ steps.cargo-get.outputs.metadata }}
          prerelease: false
          title: v${{ steps.cargo-get.outputs.metadata }} Release
          files: |
            stardb-exporter.exe
            stardb-exporter-linux
            stardb-exporter-macos
            stardb-exporter-v${{ steps.cargo-get.outputs.metadata }}-x86_64-pc-windows-msvc.zip
            stardb-exporter-v${{ steps.cargo-get.outputs.metadata }}-x86_64-unknown-linux-gnu.zip
            stardb-exporter-v${{ steps.cargo-get.outputs.metadata }}-x86_64-apple-darwin.zip
            stardb-exporter-v${{ steps.cargo-get.outputs.metadata }}-x86_64.AppImage
